<div class="login-page">
    <div class="login-card">

        <div class="role-tabs">
            <div class="role-tab" ng-class="{active: selectedRole === 'HR'}" ng-click="selectRole('HR')">HR</div>
            <div class="role-tab" ng-class="{active: selectedRole === 'EMPLOYEE'}" ng-click="selectRole('EMPLOYEE')">Employee</div>
        </div>

        <h2>{{selectedRole === 'HR' ? 'HR Login' : 'Employee Login'}}</h2>

        <form ng-submit="doLogin()">
            <label>Username</label>
            <input type="text" ng-model="credentials.username" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" ng-model="credentials.password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p class="msg-error" ng-if="errorMsg">{{errorMsg}}</p>

    </div>
</div>
